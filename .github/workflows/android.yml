name: Build Rumman Sordar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q "rumman-sordar (1).zip" -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          keytool -genkeypair -v -keystore "$PROJECT_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rumman-Sordar-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apkapk
